name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          # Some CI/sandboxed networks block binaries.prisma.sh's checksum
          # endpoint; this skips checksum verification without failing the
          # build. The query engine binary itself still downloads normally
          # on networks that allow it.
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
      - run: pnpm typecheck

  # Bonus: the project scans itself with Semgrep + Gitleaks in CI —
  # dogfooding the product, catches security regressions before merge.
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
