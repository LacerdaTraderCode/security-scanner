name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # Typechecks the packages that have no Prisma Client runtime dependency.
  # These compile standalone and catch the vast majority of real type errors
  # (adapters, orchestrator, report engine, UI components, API route logic).
  typecheck-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @scanner/shared --filter @scanner/scanners --filter @scanner/report-engine typecheck

  # Typechecks apps/web and apps/worker, which import generated Prisma types
  # (PrismaClient, ScanStatus, Finding, etc). Requires `prisma generate` to
  # download its query engine binary from binaries.prisma.sh — this step is
  # allowed to fail without blocking the PR, because some CI/corporate
  # networks block that domain outright (see prisma/orm#29547). Production
  # deploys (Vercel/Railway) are not affected by this restriction.
  typecheck-prisma-dependent:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
        env:
          PRISMA_ENGINES_CHECKSUM_IGNORE_MISSING: "1"
      - run: pnpm --filter @scanner/web --filter @scanner/worker typecheck

  # Bonus: the project scans itself with Semgrep + Gitleaks in CI —
  # dogfooding the product, catches security regressions before merge.
  self-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Semgrep
        uses: semgrep/semgrep-action@v1
        with:
          config: p/owasp-top-ten
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
